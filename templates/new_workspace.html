{% extends "base.html" %}

{% block title %}Connect Repository - MTG Deck Tester{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Connect GitHub Repository</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-4">
                        <label for="repo_url" class="form-label">Public Repository URL</label>
                        <input type="url" class="form-control" id="repo_url" name="repo_url" 
                               placeholder="https://github.com/username/repo" required>
                        <div class="form-text">Enter the full URL to a public GitHub repository.</div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="workspace_root" class="form-label">Workspace Root (optional)</label>
                        <input type="text" class="form-control" id="workspace_root" name="workspace_root"
                               placeholder="path/to/workspace">
                        <div class="form-text">Folder path within the repo. Leave empty for root.</div>
                    </div>
                    
                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-primary">Connect</button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
